<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>Time.htm</title>
<link href=../common/css/core.css rel=stylesheet>

<div class=big id=date_display></div>
UTC<input class=mini id=timezone step=1 type=number><input id=timestamp_current readonly type=text><br>
<table><tr class=header><td>Week<td>Monday<td>Tuesday<td>Wednesday<td>Thursday<td>Friday<td>Saturday<td>Sunday<tbody id=calendar></table>
<input class=mini id=year step=1 type=number>-<input class=mini id=month max=12 min=1 step=1 type=number>-<input class=mini id=date max=31 min=1 step=1 type=number><br>
<input class=mini id=hour max=23 min=0 step=1 type=number>:<input class=mini id=minute max=59 min=0 step=1 type=number>:<input class=mini id=second max=59 min=0 step=1 type=number><br>
<button id=date_to_timestamp type=button>⤷</button><input id=timestamp step=1 type=number><button id=timestamp_to_date type=button>⤴</button><br>
<span id=month_name></span> <button id=now type=button>Now</button> <span id=timestamp_seconds></span><br>
day #<span id=yearday></span>, <span id=leap></span> a leap year<br>
<div class=medium id=diff></div>
<table class=left>
  <tr>
    <td>Days
    <td id=diff_days>
  <tr>
    <td>Weeks
    <td id=diff_weeks>
  <tr>
    <td>Months
    <td id=diff_months>
  <tr>
    <td>Years
    <td id=diff_years>
</table>
<button id=add_alarm type=button>Add</button><input id=alarm_label type=text value=alarm>in<input class=mini id=alarm_seconds value=3600 step=1 type=number>seconds
<table>
  <tbody id=alarms_table>
</table>
